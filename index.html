<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şınav Sayacı</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #fff; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; user-select: none; padding: 20px 0;
    }
    .target-box { font-size: 1.3rem; margin-bottom: 10px; color: #aaa; }
    input {
      font-size: 1.5rem; width: 90px; text-align: center; border-radius: 8px;
      border: 2px solid #333; background: #222; color: #fff; padding: 5px; margin-left: 8px;
    }
    .count { font-size: 6rem; font-weight: 800; margin: 5px 0; color: #00e676; }
    .btn-big {
      width: 75vw; height: 75vw; max-width: 300px; max-height: 300px;
      border-radius: 24px; border: none;
      background: linear-gradient(145deg, #ff1744, #d50000); color: #fff;
      font-size: 4rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 12px 35px rgba(255, 23, 68, 0.5);
      transition: transform 0.05s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-big:active { transform: scale(0.93); background: #c62828; }
    .btn-mic {
      margin-top: 20px; background: #2979ff; color: #fff;
      border: none; padding: 14px 28px; border-radius: 25px;
      font-size: 1.1rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 5px 15px rgba(41, 121, 255, 0.4);
    }
    .btn-mic.active { background: #00e676; color: #000; box-shadow: 0 5px 15px rgba(0, 230, 118, 0.4); }
    .btn-reset {
      margin-top: 15px; background: transparent; color: #ff5252;
      border: 1px solid #ff5252; padding: 10px 24px; border-radius: 20px;
      font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="target-box">
    Hedef: <input type="number" id="target" value="30" min="1">
  </div>

  <div class="count" id="counter">0</div>

  <button class="btn-big" onclick="countUp()">BAS</button>
  
  <button class="btn-mic" id="micBtn" onclick="toggleSpeech()">🎙️ Sesle Saymayı Aç</button>
  
  <button class="btn-reset" onclick="resetCount()">Sıfırla</button>

  <script>
    let count = 0;
    let audioCtx = null;
    let recognition = null;
    let isListening = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Her basışta / ses algılandığında çalacak kısa vuruş sesi
    function playSinglePressSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.06);

        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.06);
      } catch (e) { console.log(e); }
    }

    // Her 10 basışta çalacak heyecan verici synth sesi
    function playTenPressSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);

        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'triangle';
          o.frequency.value = freq;
          const startTime = now + (idx * 0.05);
          g.gain.setValueAtTime(0.3, startTime);
          g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.1);
          o.connect(g);
          g.connect(ctx.destination);
          o.start(startTime);
          o.stop(startTime + 0.1);
        });
      } catch (e) { console.log(e); }
    }

    // Hedefe ulaşınca çalacak agresif zafer sesi
    function playAggressiveGoalSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const pattern = [
          { freq: 160, duration: 0.12, delay: 0 },
          { freq: 220, duration: 0.12, delay: 0.14 },
          { freq: 280, duration: 0.12, delay: 0.28 },
          { freq: 440, duration: 0.7, delay: 0.42 }
        ];

        pattern.forEach(item => {
          const startTime = now + item.delay;
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sawtooth';
          osc2.type = 'square';
          osc1.frequency.setValueAtTime(item.freq, startTime);
          osc2.frequency.setValueAtTime(item.freq * 1.01, startTime);

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(3500, startTime);

          gain.gain.setValueAtTime(0.5, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + item.duration);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(startTime);
          osc2.start(startTime);
          osc1.stop(startTime + item.duration);
          osc2.stop(startTime + item.duration);
        });
      } catch (e) { console.log(e); }
    }

    function countUp() {
      let target = parseInt(document.getElementById('target').value) || 0;
      count++;
      document.getElementById('counter').innerText = count;

      if (target > 0 && count === target) {
        playAggressiveGoalSound();
      } else if (count > 0 && count % 10 === 0) {
        playTenPressSound();
      } else {
        playSinglePressSound();
      }
    }

    function resetCount() {
      count = 0;
      document.getElementById('counter').innerText = count;
    }

    // SESLE SAYMA (MİKROFON) KODLARI
    function toggleSpeech() {
      const micBtn = document.getElementById('micBtn');
      
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Tarayıcınız ses tanımayı desteklemiyor.");
        return;
      }

      if (isListening) {
        if (recognition) recognition.stop();
        isListening = false;
        micBtn.innerText = "🎙️ Sesle Saymayı Aç";
        micBtn.classList.remove('active');
      } else {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = function(event) {
          countUp(); // Her kelime/ses algılandığında sayacı 1 arttır
        };

        recognition.onerror = function(event) {
          console.log('Ses hatası:', event.error);
        };

        recognition.onend = function() {
          if (isListening) {
            recognition.start(); // Kapanırsa otomatik tekrar başlat
          }
        };

        recognition.start();
        isListening = true;
        micBtn.innerText = "🛑 Dinleniyor... (Konuş/Say)";
        micBtn.classList.add('active');
        getAudioContext();
      }
    }
  </script>
</body>
</html>
