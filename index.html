<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessiz Göz Asistanı</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #fff; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; user-select: none; padding: 20px; transition: background 0.5s;
    }
    .status-text { font-size: 1.8rem; font-weight: bold; margin-bottom: 20px; color: #fff; }
    .timer-display {
      font-size: 6.5rem; font-weight: 900; margin: 15px 0;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .settings {
      background: #222; padding: 15px; border-radius: 15px; margin-bottom: 30px;
      display: flex; gap: 20px; border: 1px solid #333;
    }
    .setting-group { display: flex; flex-direction: column; align-items: center; }
    .setting-group label { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
    input[type="number"] {
      font-size: 1.5rem; width: 75px; text-align: center; border-radius: 8px;
      border: 2px solid #444; background: #111; color: #00e676; padding: 5px;
    }
    .btn-main {
      width: 80vw; max-width: 300px; padding: 20px; border-radius: 20px; border: none;
      background: linear-gradient(145deg, #2979ff, #1565c0); color: #fff;
      font-size: 1.8rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 10px 30px rgba(41, 121, 255, 0.4); transition: transform 0.1s;
    }
    .btn-main:active { transform: scale(0.95); }
    .btn-main.stop { background: linear-gradient(145deg, #ff1744, #d50000); box-shadow: 0 10px 30px rgba(255, 23, 68, 0.4); }
    
    .vibrate-info { margin-top: 25px; color: #888; font-size: 0.9rem; }

    /* Durum Renkleri */
    body.mode-read { background: #121212; }
    body.mode-rest { background: #004d40; } /* Uzağa bakarken dinlendirici yeşil */
  </style>
</head>
<body class="mode-read" id="bg">

  <div class="settings" id="settings">
    <div class="setting-group">
      <label>Okuma (Dk)</label>
      <input type="number" id="readTime" value="20" min="1">
    </div>
    <div class="setting-group">
      <label>Uzağa Bak (Sn)</label>
      <input type="number" id="restTime" value="20" min="5">
    </div>
  </div>

  <div class="status-text" id="status">KİTAP OKUMA VAKTİ 📖</div>
  
  <div class="timer-display" id="timer">20:00</div>

  <button class="btn-main" id="startBtn" onclick="toggleTimer()">BAŞLA</button>

  <div class="vibrate-info">📳 Uygulama sadece titreşimle uyarır.</div>

  <script>
    let timeLeft = 0;
    let timerInterval = null;
    let isRunning = false;
    let isResting = false;
    let wakeLock = null;

    // Telefon ekranının kapanmasını engelleme
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    // TİTREŞİM MOTORU
    function triggerVibration(type) {
      if (!('vibrate' in navigator)) return; // Cihaz titreşimi desteklemiyorsa pas geç
      
      if (type === 'start') {
        navigator.vibrate(150); // Tek kısa titreşim
      } else if (type === 'rest') {
        // Okuma bitti uyarısı: Uzun - Uzun - ÇOK UZUN
        navigator.vibrate([500, 200, 500, 200, 1000]);
      } else if (type === 'read') {
        // Dinlenme bitti, kitaba dön uyarısı: Kısa - Kısa
        navigator.vibrate([200, 150, 200]);
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
      document.getElementById('timer').innerText = formatTime(timeLeft);
    }

    function switchMode() {
      isResting = !isResting;
      
      const readMinutes = parseInt(document.getElementById('readTime').value) || 20;
      const restSeconds = parseInt(document.getElementById('restTime').value) || 20;

      if (isResting) {
        timeLeft = restSeconds;
        document.getElementById('status').innerText = "UZAĞA BAK, DİNLEN 👁️";
        document.getElementById('bg').className = "mode-rest";
        triggerVibration('rest');
      } else {
        timeLeft = readMinutes * 60;
        document.getElementById('status').innerText = "KİTAP OKUMA VAKTİ 📖";
        document.getElementById('bg').className = "mode-read";
        triggerVibration('read');
      }
      updateDisplay();
    }

    function toggleTimer() {
      const btn = document.getElementById('startBtn');
      const settings = document.getElementById('settings');

      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btn.innerText = "DEVAM ET";
        btn.classList.remove('stop');
        settings.style.display = "flex";
        releaseWakeLock();
      } else {
        if (timeLeft === 0) {
          const readMinutes = parseInt(document.getElementById('readTime').value) || 20;
          timeLeft = readMinutes * 60;
          isResting = false;
          document.getElementById('status').innerText = "KİTAP OKUMA VAKTİ 📖";
          document.getElementById('bg').className = "mode-read";
        }
        
        triggerVibration('start');
        requestWakeLock();
        
        updateDisplay();
        isRunning = true;
        btn.innerText = "DURAKLAT";
        btn.classList.add('stop');
        settings.style.display = "none";

        timerInterval = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            switchMode();
          } else {
            updateDisplay();
          }
        }, 1000);
      }
    }

    window.onload = () => {
      const readMinutes = parseInt(document.getElementById('readTime').value) || 20;
      document.getElementById('timer').innerText = formatTime(readMinutes * 60);
    }
  </script>
</body>
</html>
