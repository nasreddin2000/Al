<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şınav Sayacı</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #fff; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; margin: 0; user-select: none;
    }
    .target-box { font-size: 1.2rem; margin-bottom: 5px; color: #aaa; }
    input[type="number"] {
      font-size: 1.4rem; width: 85px; text-align: center; border-radius: 8px;
      border: 2px solid #333; background: #222; color: #fff; padding: 4px; margin-left: 5px;
    }
    .count { font-size: 5.5rem; font-weight: 800; margin: 5px 0; color: #00e676; }
    .btn-big {
      width: 75vw; height: 75vw; max-width: 290px; max-height: 290px;
      border-radius: 24px; border: none;
      background: linear-gradient(145deg, #ff1744, #d50000); color: #fff;
      font-size: 2.8rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 12px 35px rgba(255, 23, 68, 0.5);
      transition: transform 0.05s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-big:active { transform: scale(0.93); background: #c62828; }
    .mic-btn {
      margin-top: 15px; background: #2979ff; color: #fff; border: none;
      padding: 12px 24px; border-radius: 20px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
    }
    .mic-btn.active { background: #00e676; color: #000; }
    .btn-reset {
      margin-top: 10px; background: transparent; color: #ff5252;
      border: 1px solid #ff5252; padding: 8px 20px; border-radius: 20px;
      font-size: 0.9rem; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="target-box">
    Hedef: <input type="number" id="target" value="30" min="1">
  </div>

  <div class="count" id="counter">0</div>

  <button class="btn-big" onclick="countUp()">BAS / BURUN</button>
  
  <button id="micBtn" class="mic-btn" onclick="toggleNoiseDetector()">🎙️ Sesle Saymayı Aç</button>
  <button class="btn-reset" onclick="resetCount()">Sıfırla</button>

  <script>
    let count = 0;
    let audioCtx = null;
    let isListening = false;
    let mediaStream = null;
    let javascriptNode = null;
    let lastCountTime = 0;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTenPressSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.25);
      } catch (e) {}
    }

    function playAggressiveGoalSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [0, 0.14, 0.28, 0.42].forEach((delay, idx) => {
          const freqs = [160, 220, 280, 440];
          const startTime = now + delay;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freqs[idx], startTime);
          gain.gain.setValueAtTime(0.5, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + (idx === 3 ? 0.7 : 0.12));
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(startTime); osc.stop(startTime + (idx === 3 ? 0.7 : 0.12));
        });
      } catch (e) {}
    }

    function countUp() {
      let target = parseInt(document.getElementById('target').value) || 0;
      count++;
      document.getElementById('counter').innerText = count;

      if (target > 0 && count === target) {
        playAggressiveGoalSound();
      } else if (count > 0 && count % 10 === 0) {
        playTenPressSound();
      }
    }

    function resetCount() {
      count = 0;
      document.getElementById('counter').innerText = count;
    }

    function toggleNoiseDetector() {
      const micBtn = document.getElementById('micBtn');

      if (!isListening) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(stream => {
            mediaStream = stream;
            const ctx = getAudioContext();
            const analyser = ctx.createAnalyser();
            const microphone = ctx.createMediaStreamSource(stream);
            javascriptNode = ctx.createScriptProcessor(2048, 1, 1);

            analyser.smoothingTimeConstant = 0.4;
            analyser.fftSize = 1024;

            microphone.connect(analyser);
            analyser.connect(javascriptNode);
            javascriptNode.connect(ctx.destination);

            javascriptNode.onaudioprocess = () => {
              const array = new Uint8Array(analyser.frequencyBinCount);
              analyser.getByteFrequencyData(array);
              let values = 0;
              for (let i = 0; i < array.length; i++) {
                values += array[i];
              }
              let average = values / array.length;

              let now = Date.now();
              // Ses patlaması algılandığında (en az 0.75 saniye arayla) say
              if (average > 25 && (now - lastCountTime > 750)) {
                lastCountTime = now;
                countUp();
              }
            };

            isListening = true;
            micBtn.innerText = "🛑 Dinleniyor... (Ses Çıkarınca Sayar)";
            micBtn.classList.add('active');
          })
          .catch(err => {
            alert("Mikrofon izni verilemedi. Ekrana basılan 'İzin Ver' butonuna onay vermen gerekir.");
          });
      } else {
        isListening = false;
        if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
        if (javascriptNode) javascriptNode.disconnect();
        micBtn.innerText = "🎙️ Sesle Saymayı Aç";
        micBtn.classList.remove('active');
      }
    }
  </script>
</body>
</html>
